name: Peek titles (temporary)
on: { push: { branches: [claude/project-thread-bfffut], paths: [.github/workflows/peek.yml] } }
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in punkouter.com/collections/cyberpunk-tcg-singles-in-stock punkouter.com/collections/cyberpunk-tcg-sealed luckydice.it/collections/cyberpunk-tcg ultrararecards.co.uk/collections/cyberpunk-tcg vault-collectables.com/collections/cyberpunk sccg.co.uk/collections/cyberpunk-tcg irresistibleforce.com.au/collections/cyberpunk-tcg; do
            for p in 1 2 3; do curl -s -A "cyberpunkcompare/1.0" "https://$u/products.json?limit=250&page=$p" | jq -r --arg u "$u" '.products[]|"\($u) | \(.title) | \(.product_type) | \(.variants[0].price)"'; done
          done | grep -i "heist\|display\|beta starter\|flathead" | sort -u
          for h in ultrararecards.com.au; do :; done
          grep -h . /dev/null || true
