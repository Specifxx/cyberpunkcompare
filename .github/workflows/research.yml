name: Research (temporary)
on: { push: { branches: [claude/project-thread-bfffut], paths: [.github/workflows/research.yml] } }
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="cyberpunkcompare/1.0 (+https://cyberpunkcompare.com)"
          B="https://api.netdeck.gg/api/cyberpunk/retailers/stores"
          curl -sL -A "$UA" "$B?lat=40.7&lng=-74&maxRadiusMiles=50" | head -c 1500; echo
          : > all.jsonl
          for c in "39,-98" "45,-75" "50,-110" "37,-120" "33,-84" "42,-88" "30,-97" "47,-122" "53,-2" "56,-4" "51,10" "48,2" "45,10" "40,-4" "52,5" "59,15" "50,20" "-33,151" "-37,145" "-27,153" "-32,116" "-35,138" "-41,174" "-36,174" "1.35,103.8" "43,-79" "49,-123" "51,-114" "46,-71"; do
            curl -sL -A "$UA" "$B?lat=${c%,*}&lng=${c#*,}&maxRadiusMiles=1500" | jq -c '.stores[]?' >> all.jsonl; sleep 1; done
          jq -s 'unique_by(.id)|length' all.jsonl
          jq -s -r 'unique_by(.id)|group_by(.country // .address.country // "?")|map("\(.[0].country // .[0].address.country // "?") \(length)")|.[]' all.jsonl
          jq -s -r 'unique_by(.id)|.[]|[(.country // .address.country // "?"), (.website // .websiteUrl // .url // .web // ""), .name]|@tsv' all.jsonl | sort
