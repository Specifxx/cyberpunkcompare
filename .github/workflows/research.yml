name: Research (temporary)
on: { push: { branches: [claude/project-thread-bfffut], paths: [.github/workflows/research.yml] } }
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="cyberpunkcompare/1.0 (+https://cyberpunkcompare.com)"
          curl -sL -A "$UA" https://cyberpunktcg.com/assets/index-txRK5ZpT.js -o a.js; wc -c a.js
          grep -oE '.{80}[sS]tore[sS]?[^a-zA-Z].{120}' a.js | grep -iE 'fetch|get|api|`/|"/' | head -40
          grep -oE '`/[a-zA-Z0-9/_${}.?=&-]*`|"/[a-z][a-zA-Z0-9/_-]*(store|locat|shop|retail)[a-zA-Z0-9/_-]*"' a.js | sort -u | head -40
