name: Research (temporary)
on: { push: { branches: [claude/project-thread-bfffut], paths: [.github/workflows/research.yml] } }
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="cyberpunkcompare/1.0 (+https://cyberpunkcompare.com)"
          for u in "https://cyberpunktcg.com/api/cyberpunk/retailers/stores" "https://api.netdeck.gg/api/cyberpunk/retailers/stores" "https://cyberpunktcg.com/runtime-config.json"; do echo "== $u"; curl -sL -A "$UA" "$u" -o r.json -w "%{http_code} %{content_type}\n"; head -c 600 r.json; echo; done
          grep -oE '.{60}runtime_config_unavailable.{0,10}|function mde\(\)\{[^}]*\}|function _i\([^)]*\)\{.{0,300}' <(curl -sL -A "$UA" https://cyberpunktcg.com/assets/index-txRK5ZpT.js) | head -5
