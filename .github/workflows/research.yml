name: Research (temporary)
on: { push: { branches: [claude/project-thread-bfffut], paths: [.github/workflows/research.yml, src/content/stores.ts] } }
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsx scripts/import-all.ts 2>&1 | grep -E "^\[store\]|error|Error" | head -400
        env: { EBAY_REFRESH: "false" }
  sg:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="cyberpunkcompare/1.0 (+https://cyberpunkcompare.com)"
          curl -sL -A "$UA" "https://api.netdeck.gg/api/cyberpunk/retailers/stores?lat=1.35&lng=103.8&maxRadiusMiles=60" | jq -r '.stores[]|select(.country=="SG")|"\(.storeName)\t\(.socialWebsite // "")"' > sg.tsv; wc -l sg.tsv; cat sg.tsv
          cut -f2 sg.tsv | grep -viE 'facebook|instagram|tiktok|linktr|^$' | sed -E 's#^(https?://)?##; s#/.*$##' | sort -u | while read h; do
            m=$(curl -s -m 15 -A "$UA" "https://$h/meta.json" | jq -r '.currency // empty' 2>/dev/null)
            n=$(curl -s -m 15 -A "$UA" "https://$h/search/suggest.json?q=cyberpunk&resources[type]=product&resources[limit]=10" | jq -r '.resources.results.products|length' 2>/dev/null)
            c=$(curl -s -m 15 -A "$UA" "https://$h/collections.json?limit=250" | jq -r '[.collections[]?|select((.handle+" "+.title)|test("cyber|night";"i"))|.handle]|join(",")' 2>/dev/null)
            echo "SG $h shopify=$m suggest=$n cols=$c"; sleep 1; done
